<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shum-AI — call desk</title>
<style>
  /* ------------------------------------------------------------------
     The transcript is the product.

     Someone is standing over this laptop while a synthetic voice talks to a
     real restaurant on their behalf. The one thing they need is to read what
     is being said, from a metre away, without leaning in. So the transcript
     gets the type size, the contrast and the screen space, and everything
     else on this page shrinks until it stops competing with it.
     ------------------------------------------------------------------ */
  :root {
    --bg: #f5f5f7;            /* the grey Apple puts behind white cards */
    --card: #ffffff;
    --hair: rgba(0, 0, 0, 0.09);
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --ink-3: #a1a1a6;
    --blue: #007aff;
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
    --agent: #007aff;         /* agent bubbles: filled blue, like a sent message */
    --them: #e9e9eb;          /* restaurant bubbles: grey, like a received one */
    --radius: 18px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 22px 16px 0;
  }
  .wrap {
    width: 100%; max-width: 780px; height: calc(100vh - 22px);
    display: flex; flex-direction: column; gap: 10px;
  }

  /* ---- header ---- */
  header {
    flex: none; display: flex; align-items: center; gap: 12px;
  }
  h1 { font: 600 25px/1.2 inherit; letter-spacing: -0.021em; margin: 0; }

  /* ---- the booking strip: one line, tabular, deliberately quiet ---- */
  .strip {
    flex: none; background: var(--card); border-radius: var(--radius);
    padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 6px 26px;
    align-items: baseline; box-shadow: 0 1px 2px rgba(0,0,0,0.045);
  }
  .strip .f { display: flex; flex-direction: column; gap: 1px; }
  .strip .k {
    font-size: 11px; font-weight: 590; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .strip .v { font-size: 15px; font-weight: 450; }
  .strip .v.num { font-variant-numeric: tabular-nums; }
  .strip .f.grow { flex: 1 1 180px; min-width: 0; }
  .strip .v.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- the transcript: the hero ---- */
  .thread {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    background: var(--card); border-radius: var(--radius);
    padding: 24px 22px; box-shadow: 0 1px 2px rgba(0,0,0,0.045);
    /* Deliberately no smooth scrolling here. Under it, `scrollTop =
       scrollHeight` becomes an animation, and every new turn restarts it from
       wherever it got to. Measured with turns 120ms apart: the newest line
       ended up 1081px off-screen and never arrived, so the operator would be
       reading the conversation from a minute ago while the agent talks. The
       whole point of this page is seeing the current line. */
  }
  .turn { display: flex; margin-bottom: 16px; }
  .turn.agent { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 13px 19px; border-radius: 22px;
    font-size: 22px; line-height: 1.42; letter-spacing: -0.015em;
    font-weight: 420; word-wrap: break-word;
  }
  .turn.agent .bubble { background: var(--agent); color: #fff; border-bottom-right-radius: 7px; }
  .turn.them  .bubble { background: var(--them);  color: var(--ink); border-bottom-left-radius: 7px; }
  .who {
    font-size: 11px; font-weight: 590; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--ink-3);
    margin: 0 6px 5px; }
  .turn.agent .who { text-align: right; }
  .side { display: flex; flex-direction: column; max-width: 78%; }

  /* System lines and errors live in the thread so they cannot be missed,
     but at a size that says "not part of the conversation". */
  .note {
    text-align: center; color: var(--ink-3); font-size: 12.5px;
    margin: 12px auto 14px; max-width: 84%;
  }
  .note.err {
    color: var(--red); font-weight: 500; background: rgba(255,59,48,0.07);
    padding: 9px 14px; border-radius: 12px;
  }
  .empty { color: var(--ink-3); font-size: 16px; line-height: 1.6; text-align: center;
           margin: 12vh auto 0; max-width: 30em; }
  .empty b { display: block; color: var(--ink-2); font-size: 20px; font-weight: 500; margin-bottom: 7px; }

  /* ---- footer: mic meter + controls, sticky at the bottom ---- */
  footer {
    flex: none; background: var(--card); border-radius: var(--radius);
    padding: 13px 18px 14px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.045);
  }
  /* The microphone meter is the only diagnostic that matters for acoustic
     coupling. If it does not move while the restaurant's voice comes out of
     the phone speaker, coupling has failed and no prompt tuning will fix it.
     It is small here, but it is never hidden. */
  .meterRow { display: flex; align-items: center; gap: 12px; }
  .meter {
    flex: 1 1 auto; height: 7px; border-radius: 999px;
    background: #e9e9eb; overflow: hidden;
  }
  .meter > i {
    display: block; height: 100%; width: 0%; border-radius: 999px;
    background: var(--green); transition: width 70ms linear;
  }
  .mlabel {
    flex: none; font: 500 12px var(--mono); color: var(--ink-3);
    min-width: 190px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .controls { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button {
    font: 590 14.5px inherit; padding: 9px 19px; border-radius: 980px;
    border: none; background: #e9e9eb; color: var(--ink); cursor: pointer;
    transition: filter 120ms ease;
  }
  button:hover:not(:disabled) { filter: brightness(0.95); }
  button.go { background: var(--blue); color: #fff; }
  button.stop { background: rgba(255,59,48,0.11); color: var(--red); }
  button:disabled { opacity: 0.38; cursor: not-allowed; }
  .pill {
    font: 590 12px inherit; padding: 5px 12px; border-radius: 980px;
    background: #e9e9eb; color: var(--ink-2); letter-spacing: -0.005em;
  }
  .pill.on { background: rgba(52,199,89,0.15); color: #248a3d; }
  .pill.warn { background: rgba(255,149,0,0.16); color: #9a5a00; }
  .pill.bad { background: rgba(255,59,48,0.12); color: #c9271e; }
  .pill.blue { background: rgba(0,122,255,0.13); color: #0062cc; }
  .rail {
    margin-top: 11px; font-size: 12.5px; padding: 10px 13px; border-radius: 12px;
    background: rgba(255,149,0,0.1); color: #8a4f00;
  }
  .rail b { font-weight: 610; }
  .rail .num { font-variant-numeric: tabular-nums; font-weight: 590; }

  @media (max-width: 620px) {
    body { padding: 18px 11px 0; }
    h1 { font-size: 23px; }
    .bubble { font-size: 18px; padding: 11px 16px; }
    .mlabel { min-width: 0; font-size: 11px; }
    .thread { padding: 18px 15px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Call desk</h1>
    <span class="pill" id="stPill">waiting</span>
  </header>

  <div class="strip">
    <div class="f grow"><span class="k">Restaurant</span><span class="v clip" id="bName">—</span></div>
    <div class="f"><span class="k">Number</span><span class="v num" id="bNumber">—</span></div>
    <div class="f"><span class="k">Party</span><span class="v num" id="bParty">—</span></div>
    <div class="f grow"><span class="k">When</span><span class="v clip" id="bWhen">—</span></div>
    <div class="f"><span class="k">Under</span><span class="v" id="bBooker">—</span></div>
  </div>

  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <b>No call yet</b>
      Check the level bar below moves, dial the number on your phone, put it on
      speakerphone beside the laptop, then approve in Telegram.<br />
      The agent starts itself and says it is an AI in its first sentence.
    </div>
  </div>

  <footer>
    <div class="meterRow">
      <span class="pill" id="connPill">mic off</span>
      <div class="meter"><i id="bar"></i></div>
      <span class="mlabel" id="peak">no stream</span>
    </div>
    <div class="controls">
      <button id="armBtn">Arm microphone</button>
      <button id="startBtn" class="go" disabled>Start agent</button>
      <button id="endBtn" class="stop" disabled>End call</button>
      <span class="pill" id="modePill">idle</span>
    </div>
    <div id="railNote" hidden></div>
  </footer>
</div>

<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";

const $ = (id) => document.getElementById(id);
const state = {
  cfg: null, pending: null, conv: null, transcript: [],
  armed: false, running: false, startedFor: null, conversationId: null,
};

function clearEmpty() {
  const e = $("empty");
  if (e) e.remove();
}

// Two kinds of line, deliberately unequal. What the agent and the restaurant
// said is the conversation, and gets a bubble at reading size. Everything else
// — status, diagnostics, failures — is a small note, present but not competing.
function say(who, text) {
  clearEmpty();
  const thread = $("thread");
  const turn = document.createElement("div");
  turn.className = "turn " + who;
  const side = document.createElement("div");
  side.className = "side";
  const label = document.createElement("div");
  label.className = "who";
  label.textContent = who === "agent" ? "Agent" : "Restaurant";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  side.append(label, bubble);
  turn.append(side);
  thread.append(turn);
  thread.scrollTop = thread.scrollHeight;
}

function note(text, isError = false) {
  clearEmpty();
  const thread = $("thread");
  const row = document.createElement("div");
  row.className = isError ? "note err" : "note";
  row.textContent = text;
  thread.append(row);
  thread.scrollTop = thread.scrollHeight;
}

// Kept as `log` so every call site below reads the same as before.
function log(kind, text) {
  if (kind === "ai") return say("agent", text);
  if (kind === "them") return say("them", text);
  note(text, kind === "err");
}
const pill = (el, text, cls = "") => { el.textContent = text; el.className = "pill " + cls; };

// ------------------------------------------------------------------
// Microphone metering
// ------------------------------------------------------------------
// getUserMedia hangs FOREVER if the permission prompt is dismissed rather than
// answered — no error, no rejection, the page just sits there looking fine.
// So: check the permission state first to give an honest message, and race the
// call against a timeout so a dismissed prompt surfaces as a failure instead
// of a freeze.
async function armMicrophone() {
  try {
    if (navigator.permissions?.query) {
      const st = await navigator.permissions.query({ name: "microphone" });
      log("sys", `microphone permission: ${st.state}`);
      if (st.state === "denied") {
        log("err", "Permission is denied at the browser level. Fix it in the padlock menu, then reload.");
        pill($("connPill"), "mic denied", "bad");
        return false;
      }
    }
  } catch { /* Safari and some Chromium builds do not expose the mic descriptor */ }

  let stream;
  try {
    stream = await Promise.race([
      navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      }),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 9000)),
    ]);
  } catch (err) {
    if (err.message === "timeout") {
      log("err", "getUserMedia never resolved — the permission prompt was probably dismissed. Reload and press Allow.");
    } else {
      log("err", `getUserMedia failed: ${err.name} — ${err.message}`);
    }
    pill($("connPill"), "no mic", "bad");
    return false;
  }

  const track = stream.getAudioTracks()[0];
  log("sys", `input device: ${track?.label || "unknown"}`);

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  let peak = 0, everMoved = false;

  (function tick() {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    const pct = Math.min(100, rms * 420);
    peak = Math.max(peak, rms);
    if (rms > 0.02) everMoved = true;
    $("bar").style.width = pct.toFixed(1) + "%";
    $("bar").style.background = rms > 0.004 ? "var(--green)" : "#e9e9eb";
    $("peak").textContent = everMoved
      ? `peak ${peak.toFixed(3)} · coupling confirmed`
      : `peak ${peak.toFixed(3)} · talk into the phone`;
    requestAnimationFrame(tick);
  })();

  state.armed = true;
  $("armBtn").disabled = true;
  $("startBtn").disabled = false;
  pill($("connPill"), "mic live", "on");
  log("sys", "Microphone armed. Confirm the bar moves BEFORE you start the agent.");
  return true;
}

// ------------------------------------------------------------------
// The agent
// ------------------------------------------------------------------
// The agent's prompt drops when_text straight into a sentence, so a chat that
// said "8pm" made it say "a table for 6 people 8pm" out loud to a real
// restaurant on the 15:14 call. It recovered, but only because the person on
// the other end was forgiving. Give the phrase a preposition unless the chat
// already supplied one, and never rewrite what the chat actually said --
// pending.when_text is left alone, so the booking record and the calendar
// entry still carry the group's own words.
function hasClock(text) {
  // Mirrors invite.event_time's rule: an HOUR has to be present. "this
  // evening" and "lunchtime" are not times, and a call that says one of those
  // to a restaurant gets a table at an hour nobody agreed to.
  const t = String(text || "").toLowerCase();
  return /\b(noon|midday|midnight)\b/.test(t)
      || /\b\d{1,2}(:\d{2})?\s*(a\.?m\.?|p\.?m\.?)\b/.test(t)
      || /\b\d{1,2}:\d{2}\b/.test(t)
      || /\b(?:at|for|around|by|from)\s+\d{1,2}\b/.test(t);
}

function spokenWhen(text) {
  const t = String(text || "").trim();
  if (!t) return t;          // validated upstream; never substitute a guess
  // Weekdays need the suffix: /fri\b/ does not match "friday", which turned
  // "friday at 9" into "at friday at 9".
  const leads = /^((at|on|in|for|around|about|by|from|this|that|today|tonight|tomorrow|next|after|before)\b|(mon|tue|wed|thu|fri|sat|sun)[a-z]*\b)/i;
  return leads.test(t) ? t : "at " + t;
}

async function startAgent() {
  if (state.running) return;
  if (!state.cfg?.agent_id) { log("err", "No ELEVENLABS_AGENT_ID in .env — the bridge served an empty agent id."); return; }
  if (!state.armed) { log("err", "Arm the microphone first."); return; }

  const p = state.pending || {};

  // NEVER invent the facts of a booking. This used to fall back to a party of
  // four and a time of "this evening", which meant a missing field became
  // something the agent said OUT LOUD to a real restaurant as though the group
  // had asked for it. bot.py already refuses to arm a vague booking, but the
  // operator console can /amend one and this page has a manual start button,
  // so the last word has to be here.
  const missing = [];
  if (!(p.restaurant_display || p.restaurant_name)) missing.push("a restaurant");
  const party = Number(p.party_size);
  if (!Number.isInteger(party) || party < 1) missing.push("a party size");
  if (!hasClock(p.when_text)) missing.push("an exact time");
  if (missing.length) {
    log("err", "Not starting: this booking is missing " + missing.join(" and ") +
               ". Settle it in the chat first \u2014 the agent will not make it up.");
    return;
  }

  state.transcript = [];
  state.running = true;
  state.startedFor = p.id || "manual";
  $("startBtn").disabled = true;
  $("endBtn").disabled = false;
  pill($("connPill"), "connecting", "warn");

  // Dynamic variables, not a rewritten prompt. The agent's own prompt stays
  // fixed and reviewed — including its AI disclosure — and only the facts of
  // this one booking change. That keeps the disclosure impossible to
  // accidentally edit out from here.
  const vars = {
    restaurant_name: String(p.restaurant_display || p.restaurant_name || "your restaurant"),
    party_size: String(party),
    when_text: spokenWhen(p.when_text),
    booking_name: String(p.booking_name || state.cfg.booker_name || "a guest"),
    callback_number: String(p.callback_number || state.cfg.callback_number || ""),
    constraints_text: (p.constraints || []).join("; ") || "no special requirements",
    notes: String(p.notes || ""),
  };
  log("sys", `starting agent · ${vars.restaurant_name} · party ${vars.party_size} · ${vars.when_text}`);

  try {
    state.conv = await Conversation.startSession({
      agentId: state.cfg.agent_id,
      connectionType: "webrtc",   // WebRTC, not websocket: its echo cancellation
                                  // and noise removal are exactly what a phone
                                  // held next to a laptop mic needs.
      dynamicVariables: vars,
      onConnect: ({ conversationId }) => {
        // Keep the id: it is how the bridge asks ElevenLabs for the agent's own
        // data-collection result once the call has been analysed server-side.
        state.conversationId = conversationId || null;
        pill($("connPill"), "on the call", "on");
        log("sys", `connected · conversation ${conversationId || "?"}`);
      },
      onDisconnect: () => { pill($("connPill"), "disconnected"); finish("disconnected"); },
      onError: (msg, ctx) => log("err", `agent error: ${msg} ${ctx ? JSON.stringify(ctx) : ""}`),
      onModeChange: ({ mode }) => pill($("modePill"),
        mode === "speaking" ? "agent speaking" : "listening",
        mode === "speaking" ? "blue" : ""),
      onStatusChange: ({ status }) => log("sys", `status: ${status}`),
      onMessage: ({ message, source }) => {
        state.transcript.push({ source, message, at: new Date().toISOString() });
        log(source === "user" ? "them" : "ai", message);
        // Push it to the bridge immediately so the group watches the call
        // happen instead of waiting for a summary. Fire and forget: a dropped
        // turn must never interrupt a live phone call, and the bridge
        // re-renders the whole transcript on the next one anyway.
        fetch("/turn", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source, message }),
        }).catch(() => {});
      },
    });
  } catch (err) {
    log("err", `could not start session: ${err?.message || err}`);
    if (String(err?.message || "").match(/auth|signed|401|403/i)) {
      log("err", "That looks like an auth failure: switch the agent's authentication setting OFF, or you must pass a signed URL.");
    }
    state.running = false;
    $("startBtn").disabled = false;
    $("endBtn").disabled = true;
    pill($("connPill"), "failed", "bad");
  }
}

async function endCall() {
  if (state.conv) { try { await state.conv.endSession(); } catch { /* already gone */ } }
  finish("ended by operator");
}

let finished = false;
async function finish(reason) {
  if (finished || !state.running) return;
  finished = true;
  state.running = false;
  $("endBtn").disabled = true;
  $("startBtn").disabled = !state.armed;
  pill($("modePill"), "idle");
  log("sys", `call finished (${reason}) · ${state.transcript.length} turns`);

  try {
    const res = await fetch("/outcome", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        status: reason,
        transcript: state.transcript,
        conversation_id: state.conversationId || null,
        turns: state.transcript.length,
      }),
    });
    const out = await res.json();
    if (out.outcome_source) log("sys", `structured outcome via ${out.outcome_source}`);
    log("sys", out.telegram_sent ? "result posted back to the group chat" : "result archived locally (Telegram post failed)");
  } catch (err) {
    log("err", `could not post outcome: ${err.message}`);
  }
  state.conv = null;
  setTimeout(() => { finished = false; }, 1500);
}

// ------------------------------------------------------------------
// Poll the bridge
// ------------------------------------------------------------------
function renderPending(p) {
  // "Is the object non-empty" is the wrong question. pending_call.json is
  // patched in place and never emptied, so after a finished call it still
  // holds a status, a transcript and the last number dialled. Treating that
  // as a live booking showed the amber consent rail — "this dials a real
  // venue" — over a blank strip with nothing pending, and left a stale number
  // on screen for an operator to dial. Both are worse than showing nothing.
  //
  // A call is live only when there is somewhere to dial, something to call it,
  // and the bridge has not already closed it out.
  const has = !!(p && p.dial_number
                 && (p.restaurant_display || p.restaurant_name)
                 && p.status !== "done");
  $("bName").textContent = has ? (p.restaurant_display || p.restaurant_name) : "—";
  $("bNumber").textContent = has ? p.dial_number : "—";
  $("bParty").textContent = has ? (p.party_size ?? "—") : "—";
  $("bWhen").textContent = has ? (p.when_text || "—") : "—";
  $("bBooker").textContent = has ? (p.booking_name || "—") : "—";

  const st = has ? (p.status || "pending") : "waiting";
  pill($("stPill"), st, st === "dialing" ? "on" : "warn");

  const rail = $("railNote");
  if (has && p.demo_override) {
    rail.hidden = false;
    rail.className = "rail";
    rail.innerHTML = `<b>Safety rail active.</b> DEMO_PHONE is set, so this call goes to
      <span class="num">${p.dial_number}</span> — a number you control — not to
      ${p.real_number ? `<span class="num">${p.real_number}</span>, ` : ""}the restaurant.
      The group chat was told this too.`;
  } else if (has) {
    rail.hidden = false;
    rail.className = "rail";
    rail.innerHTML = `<b>Live call.</b> This dials a real venue that gave consent in advance.
      The agent discloses it is an AI in its first sentence. If a table is booked, turn up or cancel it.`;
  } else {
    rail.hidden = true;
  }
}

async function poll() {
  try {
    const p = await (await fetch("/pending", { cache: "no-store" })).json();
    state.pending = p;
    renderPending(p);
    // Auto-start once, on the transition to dial:true, and only if the
    // operator already armed the mic. A human pressed approve in Telegram and a
    // human dials the phone — this page never initiates anything on its own.
    if (p?.dial && state.armed && !state.running && state.startedFor !== p.id) {
      log("sys", "approval received from the group chat — starting");
      startAgent();
    }
  } catch { /* bridge restarting; next tick will pick it up */ }
}

async function boot() {
  try {
    state.cfg = await (await fetch("/config", { cache: "no-store" })).json();
    if (!state.cfg.agent_id_present) log("err", "ELEVENLABS_AGENT_ID is not set in .env.");
  } catch {
    log("err", "Cannot reach the bridge on :8080. Start it with  python3 bridge/server.py");
  }
  if (location.protocol === "file:") {
    log("err", "This page is on file:// — getUserMedia will be refused. Open http://localhost:8080/ instead.");
  }
  await autoArm();
  poll();
  setInterval(poll, 1200);
}

// Arm the microphone automatically when the browser has already been told yes
// for this origin. getUserMedia only prompts the FIRST time; after that the
// grant is remembered per-origin, so making the operator press a button on
// every reload is pure ceremony. The button stays for the first run, and for
// anyone whose permission state is "prompt".
//
// Arming a microphone is not initiating a call and carries no safety meaning:
// the agent still does not speak until an approval arrives, and a human still
// dials the phone.
async function autoArm() {
  try {
    if (!navigator.permissions?.query) return;
    const st = await navigator.permissions.query({ name: "microphone" });
    if (st.state === "granted") {
      await armMicrophone();
    }
  } catch { /* Safari and some Chromium builds do not expose the descriptor */ }
}

$("armBtn").addEventListener("click", armMicrophone);
$("startBtn").addEventListener("click", startAgent);
$("endBtn").addEventListener("click", endCall);
boot();
</script>
</body>
</html>
